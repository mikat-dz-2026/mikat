<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محدث منصة ميقات الخطيب التلقائي</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; padding: 20px; text-align: center; }
        .card { background: white; max-width: 500px; margin: 30px auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        input[type="text"] { width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; text-align: center; font-size: 16px; }
        .btn { background: #18bc9c; color: white; border: none; padding: 12px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 90%; font-size: 16px; }
        .btn:hover { opacity: 0.9; }
        .note { font-size: 13px; color: #7f8c8d; margin-top: 15px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔄 محدث منصة ميقات الخطيب 2026</h2>
    <p style="margin-bottom:15px; font-size:14px;">هذه الأداة تقوم بتحديث ملفات تطبيقك مباشرة على مستودع GitHub الخاص بك بضغطة زر.</p>
    
    <input type="text" id="token" placeholder="أدخل رمز الشخصي (GitHub Token)">
    <button class="btn" onclick="startUpdate()">تحديث المنصة الآن فوراً 🚀</button>
    
    <div class="note">
        * يتطلب الرمز (Token) الخاص بحسابك لإتمام عملية الرفع البرمجية بنجاح والأمان.<br>
        * وصلى الله وسلم على سيدنا محمد.
    </div>
</div>

<script>
function startUpdate() {
    const token = document.getElementById('token').value.trim();
    if(!token) { alert('الرجاء إدخال الرمز الخاص بك أولاً.'); return; }
    alert('جاري إرسال التحديثات الجديدة إلى المستودع الخاص بك...');
}
</script>

</body>
</html>
